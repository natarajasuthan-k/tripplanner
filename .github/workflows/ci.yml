# backend-spec §11 / frontend-spec §11. Deploy jobs are added once Cloudflare/Neon accounts exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # API integration tests (apps/api/test) run against a real Postgres.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
          POSTGRES_DB: tripplanner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trip -d tripplanner_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trip:trip@localhost:5432/tripplanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
