# Production deploy — backend-spec §12. Runs after CI passes on `main`, or manually.
# Requires the repository secrets/variables listed in docs/deployment.md (step 6).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. Database first: migrations only add things (backend-spec §10), so the old Worker keeps
      #    working against the new schema while the new one deploys.
      - name: Migrate database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 2. API (Cloudflare Workers).
      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production

      # 3. Web (Cloudflare Pages) — built against the production API URL.
      - name: Build web
        run: pnpm --filter @tripplanner/web build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Deploy web
        working-directory: apps/api
        run: >-
          pnpm exec wrangler pages deploy ../web/dist
          --project-name "${{ vars.PAGES_PROJECT }}" --branch main --commit-dirty=true

      # 4. Smoke test: API health (DB + config) and the web app shell.
      - name: Smoke test
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.API_BASE_URL }}/health"; then break; fi
            echo "health check failed (attempt $i), retrying..."; sleep 10
            if [ "$i" = 5 ]; then exit 1; fi
          done
          echo
          curl -fsS -o /dev/null -w "web: %{http_code}\n" "${{ vars.APP_URL }}/"
          curl -fsS -I "${{ vars.APP_URL }}/" | grep -i "content-security-policy"
