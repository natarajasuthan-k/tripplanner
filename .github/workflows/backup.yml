# Weekly encrypted database backup — backend-spec §12 ("weekly pg_dump").
# The dump contains trip access codes, so it is encrypted with BACKUP_PASSPHRASE before it is
# stored as a workflow artifact (artifacts can be visible to anyone who can read the repo).
name: Backup

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE is not set"; exit 1; }
          name="tripplanner-$(date -u +%Y%m%dT%H%M%SZ).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner "$DATABASE_URL" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 --output "$name.gpg" 3<<<"$BACKUP_PASSPHRASE"
          ls -lh "$name.gpg"
          echo "BACKUP_FILE=$name.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 35
